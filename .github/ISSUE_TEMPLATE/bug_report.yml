name: 問題回報
description: 回報遊戲操作、棋盤或手機顯示問題
title: '[Bug] '
body:
  - type: input
    id: environment
    attributes:
      label: 裝置與瀏覽器
      placeholder: 例如 iPhone、iOS 版本、Safari
    validations:
      required: true
  - type: input
    id: level
    attributes:
      label: 發生問題的關卡
  - type: textarea
    id: steps
    attributes:
      label: 重現步驟與實際結果
      description: 請描述點擊、雙擊、滑動或提示操作。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 預期結果
    validations:
      required: true
  - type: textarea
    id: screenshot
    attributes:
      label: 截圖或補充資訊
      description: 截圖請先遮蔽個人資料。
